name: Temporary Windows ARM64 package qualification

on:
  push:
    branches:
      - fix/windows-arm64-ffmpeg

permissions:
  contents: read

jobs:
  qualify:
    name: Windows ARM64 packed package
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pinned Node 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install locked dependencies and build
        shell: pwsh
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Pack the local package without running lifecycle scripts
        id: pack
        shell: pwsh
        run: |
          $packed = npm pack --ignore-scripts --json --pack-destination $env:RUNNER_TEMP | ConvertFrom-Json
          if ($packed.Count -ne 1 -or -not $packed[0].filename) {
            throw "Local npm pack did not produce exactly one tarball."
          }
          $tarball = Join-Path $env:RUNNER_TEMP $packed[0].filename
          if (-not (Test-Path -LiteralPath $tarball -PathType Leaf)) {
            throw "Packed tarball was not found at $tarball."
          }
          "tarball=$tarball" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Run the packed tarball native qualification harness
        shell: pwsh
        env:
          URMA_EXPECTED_TARGET: windows-arm64
          URMA_PACKAGE_TARBALL: ${{ steps.pack.outputs.tarball }}
          URMA_RUNNER_LABEL: windows-11-vs2026-arm
        run: |
          $env:URMA_QUALIFY_NODE_VERSION = (Get-Content .node-version -Raw).Trim()
          $env:URMA_RESULT_DIR = Join-Path $env:RUNNER_TEMP "qualification-results-windows-arm64"
          New-Item -ItemType Directory -Path $env:URMA_RESULT_DIR -Force | Out-Null
          node scripts/qualify-native.mjs

      - name: Upload native qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: urma-qualification-windows-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-results-windows-arm64
          if-no-files-found: warn
          retention-days: 14
