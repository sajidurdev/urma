name: Temporary Windows ARM64 diagnostic

on:
  push:
    branches:
      - fix/windows-arm64-ffmpeg
    paths:
      - .github/workflows/diagnose-windows-arm64.yml
      - scripts/diagnose-windows-arm64.mjs
      - scripts/qualify-native.mjs
      - src/distribution/archive.ts
      - src/distribution/download.ts
      - src/distribution/installer.ts
      - src/distribution/manifest.ts
      - src/distribution/qualification.ts
      - src/subprocess/runner.ts
      - src/subprocess/versions.ts
      - package.json
      - pnpm-lock.yaml
      - .node-version

permissions:
  contents: read

concurrency:
  group: windows-arm64-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    name: Windows ARM64 setup diagnosis
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up the pinned Node runtime
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Install locked dependencies
        shell: pwsh
        run: |
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile

      - name: Build the repository modules used by the diagnostic
        id: build
        run: pnpm build

      - name: Capture exact setup subprocess and path diagnostics
        id: diagnostic
        shell: pwsh
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP "urma-arm64-diagnostics"
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $env:URMA_DIAGNOSTICS_DIR = $diagnostics
          node scripts/diagnose-windows-arm64.mjs

      - name: Pack the local package without publishing
        id: pack
        if: ${{ always() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $packed = npm pack --ignore-scripts --json --pack-destination $env:RUNNER_TEMP | ConvertFrom-Json
          if ($packed.Count -ne 1 -or -not $packed[0].filename) {
            throw "Local npm pack did not produce exactly one tarball."
          }
          $tarball = Join-Path $env:RUNNER_TEMP $packed[0].filename
          if (-not (Test-Path -LiteralPath $tarball -PathType Leaf)) {
            throw "Packed tarball was not found at $tarball."
          }
          "tarball=$tarball" | Add-Content -LiteralPath $env:GITHUB_OUTPUT

      - name: Qualify the exact packed package on native Windows ARM64
        id: package-qualification
        if: ${{ always() && steps.build.outcome == 'success' && steps.pack.outcome == 'success' }}
        shell: pwsh
        env:
          URMA_EXPECTED_TARGET: windows-arm64
          URMA_PACKAGE_TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          $env:URMA_QUALIFY_NODE_VERSION = (Get-Content .node-version -Raw).Trim()
          $env:URMA_RESULT_DIR = Join-Path $env:RUNNER_TEMP "urma-arm64-package-qualification"
          New-Item -ItemType Directory -Path $env:URMA_RESULT_DIR -Force | Out-Null
          node scripts/qualify-native.mjs

      - name: Upload diagnostic and package qualification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/urma-arm64-diagnostics
            ${{ runner.temp }}/urma-arm64-package-qualification
          if-no-files-found: warn
          retention-days: 7
